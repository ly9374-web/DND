    角色状态：
    持有：
4.任务：
5.当下剧情:
-其中“主角为：xxx”的部分持久保持不改变
-其中NPC记录所有登场后和用户角色有过2轮对话的NPC（他和用户角色至少说过2句话，用户角色也和她至少说过2句话）,并用将“NPC1/2/3”的名字改为NPC在故事中的名称
-其中“长期剧情记忆“为客观总结剧情中值得记住的事件长久的事件和谁知道此事。
    长期剧情记忆细则：1.仅记录影响剧情的长期记忆，包括但不限于：未解释缘由的伏笔、影响角色关系的事件、影响后续剧情有影响的决定转折点事件、对剧情有影响或有解释意义的重要信息、主角团一起的重要的经历、角色间的保证和承诺、等对后续剧情有影响的信息，不影响剧情的小事件不计入剧情记忆。2.允许用新状态改写旧状态（比如之前记录xx和yy为敌人,最近几轮两人因为合作关系变为好友则记录为：xx和yy之前为敌人，合作之后现在为朋友）3.根据在场者和事件传播方式推测知道此剧情的人物有谁并记录（如：知道此事的人为：校舍保安，狼影，蒙面男）4.每段记忆用尽可能精简的语句总结，仅记录事件结果不记录过程
-其中”角色状态”记录“主角为:xxx”中主角的生理特殊状态，角色状态为案例为：“正在蓄力xx”"开启yy能力"“疲劳”“腿部受伤“”用了加强药剂“”中毒“，持有为当前主角拥有的物质，比如”钥匙“”水瓶“”刀“（当收起或者给出时删除拥有的物质）。当有多主角时单独记录每个主角的状态，并在前面加上主角名称以区分。
