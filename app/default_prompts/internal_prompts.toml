1.先大致描述我所处的场景，我处在这个场景的什么位置
2.在我的视角能看到的人物有哪些，在我的视角下其他人物外形是什么，有什么特征（比如我如果只能看到背影就不要描述相貌，正面对我就描述相貌），人物是什么姿势，人物互相是什么位置，人物相对于我的视角是什么位置
