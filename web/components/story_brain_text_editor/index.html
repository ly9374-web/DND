<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>story_brain_text_editor</title>
    <style>
      :root {
        /* Keep the iframe canvas transparent so the page veil shows through.
           `dark` makes the canvas opaque (#121212) and hides the mask. */
        color-scheme: normal;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        --editor-bg: transparent;
        --editor-surface: rgba(16, 24, 28, 0.72);
        --editor-surface-2: rgba(12, 19, 23, 0.82);
        --editor-border: rgba(196, 212, 189, 0.16);
        --editor-border-strong: rgba(196, 212, 189, 0.42);
        --editor-text: #eee5e0;
        --editor-text-muted: rgba(238, 229, 224, 0.58);
      }

      html,
      body {
        margin: 0;
        padding: 0;
        background: transparent;
      }

      .shell {
        box-sizing: border-box;
        width: 100%;
        min-height: 220px;
        border: 0;
        border-radius: 0;
        background: var(--editor-bg);
        box-shadow: none;
        overflow: visible;
      }

      .viewer,
      .editor {
        box-sizing: border-box;
        width: 100%;
        min-height: 220px;
      }

      .viewer {
        padding: 0;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        color: var(--dnd-editor-ink, var(--editor-text));
        font-size: 16px;
        line-height: 1.9;
        cursor: text;
      }

      .placeholder {
        color: var(--editor-text-muted);
      }

      .editor {
        display: none;
      }

      textarea {
        box-sizing: border-box;
        display: block;
        width: 100%;
        min-height: 220px;
        max-height: 420px;
        padding: 10px 12px;
        border: 1px solid var(--editor-border);
        border-radius: 8px;
        outline: 0;
        resize: none;
        color: var(--editor-text);
        background: var(--editor-surface);
        font: 15px/1.7 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      }

      textarea:focus {
        border-color: var(--editor-border-strong);
      }

      .toolbar {
        display: flex;
        justify-content: flex-end;
        gap: 8px;
        padding: 10px 0 0;
        border-top: 0;
        background: transparent;
      }

      button {
        min-width: 64px;
        height: 32px;
        border: 1px solid var(--editor-border);
        border-radius: 6px;
        background: rgba(48, 53, 55, 0.4);
        -webkit-backdrop-filter: blur(16px) saturate(130%);
        backdrop-filter: blur(16px) saturate(130%);
        color: var(--editor-text);
        font: 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        cursor: pointer;
      }

      button.primary {
        border-color: var(--editor-border-strong);
        background: rgba(196, 212, 189, 0.2);
        color: #eef3e9;
      }

      button:hover {
        border-color: var(--editor-border-strong);
        background: rgba(196, 212, 189, 0.1);
      }

      button.primary:hover {
        background: rgba(196, 212, 189, 0.28);
      }

      .is-editing .viewer {
        display: none;
      }

      .is-editing .editor {
        display: block;
      }
    </style>
  </head>
  <body>
    <div id="shell" class="shell">
      <div id="viewer" class="viewer"></div>
      <div id="editor" class="editor">
        <textarea id="textarea"></textarea>
        <div class="toolbar">
          <button id="cancel" type="button">取消</button>
          <button id="save" class="primary" type="button">保存</button>
        </div>
      </div>
    </div>

    <script>
      const shell = document.getElementById("shell")
      const viewer = document.getElementById("viewer")
      const textarea = document.getElementById("textarea")
      const saveButton = document.getElementById("save")
      const cancelButton = document.getElementById("cancel")
      let value = ""
      let disabled = false
      let lastFrameHeight = 0

      function post(type, payload) {
        window.parent.postMessage(
          {
            isStreamlitMessage: true,
            type,
            ...payload,
          },
          "*"
        )
      }

      function setHeight() {
        const height = Math.max(shell.scrollHeight, 240)
        if (height === lastFrameHeight) return
        lastFrameHeight = height
        post("streamlit:setFrameHeight", { height })
      }

      function renderViewer() {
        const text = String(value || "")
        const nextText = text || "Story Brain"
        if (viewer.textContent !== nextText) viewer.textContent = nextText
        viewer.classList.toggle("placeholder", !text)
        setHeight()
      }

      function enterEdit() {
        if (disabled) return
        textarea.value = value
        shell.classList.add("is-editing")
        setTimeout(() => textarea.focus(), 0)
        setHeight()
      }

      function exitEdit() {
        shell.classList.remove("is-editing")
        setHeight()
      }

      function save() {
        if (disabled) return
        value = textarea.value
        renderViewer()
        exitEdit()
        post("streamlit:setComponentValue", {
          value,
          dataType: "json",
        })
      }

      document.addEventListener("wheel", (event) => {
        if (shell.classList.contains("is-editing")) return
        try {
          window.parent.__dndImmersive?.wheelFromBrain(event)
        } catch (_) {}
      }, { passive: false })

      viewer.addEventListener("dblclick", (event) => {
        event.preventDefault()
        enterEdit()
      })

      saveButton.addEventListener("click", save)
      cancelButton.addEventListener("click", exitEdit)
      textarea.addEventListener("input", setHeight)
      textarea.addEventListener("keydown", (event) => {
        if ((event.metaKey || event.ctrlKey) && event.key === "Enter") {
          event.preventDefault()
          save()
        }
        if (event.key === "Escape") {
          event.preventDefault()
          exitEdit()
        }
      })

      window.addEventListener("message", (event) => {
        if (!event.data || event.data.type !== "streamlit:render") {
          return
        }
        const args = event.data.args || {}
        value = String(args.value || "")
        disabled = Boolean(args.disabled)
        textarea.disabled = disabled
        saveButton.disabled = disabled
        viewer.setAttribute("aria-readonly", String(disabled))
        if (disabled) exitEdit()
        renderViewer()
      })

      new ResizeObserver(setHeight).observe(shell)
      post("streamlit:componentReady", { apiVersion: 1 })
      renderViewer()
    </script>
  </body>
</html>
