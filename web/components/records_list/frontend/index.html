<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    html, body { margin: 0; background: transparent; color: #e5e7eb; font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    #records { display: flex; flex-direction: column; gap: 4px; padding: 3px; }
    .record { display: flex; align-items: center; gap: 10px; padding: 5px 6px; border-radius: 6px; cursor: pointer; outline: none; }
    .record:hover { background: rgba(255,255,255,.04); }
    .record:focus-visible { outline: 2px solid #55b8ff; }
    .record::before { content: ""; flex: 0 0 14px; height: 14px; border: 2px solid #9ca3af; border-radius: 50%; box-sizing: border-box; }
    .record[aria-checked="true"]::before { border: 4px solid #ff4b4b; }
    .label { white-space: pre-wrap; overflow-wrap: anywhere; min-width: 0; }
  </style>
</head>
<body>
  <div id="records" role="radiogroup" aria-label="选择记录"></div>
  <script>
    const list = document.getElementById("records");
    let selectedId = "";
    let signature = "";
    function post(type, payload) {
      window.parent.postMessage({isStreamlitMessage: true, type, ...payload}, "*");
    }
    function updateSelection(id) {
      selectedId = id;
      for (const row of list.children) {
        const selected = row.dataset.id === id;
        row.setAttribute("aria-checked", String(selected));
        row.tabIndex = selected ? 0 : -1;
      }
    }
    function send(action, id) {
      updateSelection(id);
      post("streamlit:setComponentValue", {
        value: {action, record_id: id, event_id: crypto.randomUUID()}, dataType: "json",
      });
    }
    function resize() {
      post("streamlit:setFrameHeight", {height: Math.ceil(list.getBoundingClientRect().height)});
    }
    window.addEventListener("message", (event) => {
      if (event.source !== window.parent || event.data.type !== "streamlit:render") return;
      const args = event.data.args;
      const nextSignature = JSON.stringify(args.items);
      // Keep row nodes across selection reruns so the second click still targets
      // the same element and produces a native double-click event.
      if (signature !== nextSignature) {
        signature = nextSignature;
        list.replaceChildren();
        for (const item of args.items) {
          const row = document.createElement("div");
          row.className = "record";
          row.dataset.id = item.id;
          row.setAttribute("role", "radio");
          row.title = "单击选中，双击打开";
          const label = document.createElement("span");
          label.className = "label";
          label.textContent = item.title + "    " + item.updated_at;
          row.append(label);
          row.addEventListener("click", () => {
            if (selectedId !== item.id) send("select", item.id);
          });
          row.addEventListener("dblclick", (event) => {
            event.preventDefault();
            send("open", item.id);
          });
          row.addEventListener("keydown", (event) => {
            if (event.isComposing) return;
            if (event.key === "Enter") {
              event.preventDefault();
              send("open", item.id);
            } else if (event.key === " ") {
              event.preventDefault();
              send("select", item.id);
            } else if (["ArrowDown", "ArrowRight", "ArrowUp", "ArrowLeft"].includes(event.key)) {
              event.preventDefault();
              const rows = Array.from(list.children);
              const delta = ["ArrowDown", "ArrowRight"].includes(event.key) ? 1 : -1;
              const next = rows[(rows.indexOf(row) + delta + rows.length) % rows.length];
              next.focus();
              send("select", next.dataset.id);
            }
          });
          list.append(row);
        }
      }
      updateSelection(args.selected_id);
      resize();
    });
    new ResizeObserver(resize).observe(list);
    post("streamlit:componentReady", {apiVersion: 1});
  </script>
</body>
</html>
